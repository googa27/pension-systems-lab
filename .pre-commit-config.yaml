repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^data/processed/
      - id: end-of-file-fixer
        exclude: ^data/processed/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--redact]
  - repo: local
    hooks:
      - id: publication-guard
        name: publication privacy guard
        entry: python scripts/publication_guard.py --mode git
        language: system
        pass_filenames: false

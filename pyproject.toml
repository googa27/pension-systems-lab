[project]
name = "chile-demographic-pde"
version = "0.1.0"
description = "Research prototype for public demographic and pension-system modeling; not official or legal projections"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Pension Systems Lab contributors" }]
dependencies = [
  "duckdb>=1.3,<2",
  "fsspec>=2025.3,<2027",
  "ipykernel>=6.31.0",
  "jax>=0.9,<0.10",
  "matplotlib>=3.10,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "numpy>=2.2,<3",
  "numpyro==0.21.0",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.24,<1",
  "pint>=0.24,<1",
  "pooch>=1.9,<2",
  "pyarrow>=24,<25",
  "pydantic>=2.11,<3",
  "scikit-fem==12.0.2",
  "scipy>=1.15,<2",
  "statsmodels>=0.14,<0.15",
  "xarray>=2025.1,<2027",
  "zarr>=3.1,<4",
]

[project.scripts]
pension-lab = "chile_demographic_pde.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chile_demographic_pde"]

[tool.hatch.build.targets.wheel.force-include]
"data/processed" = "data/processed"
"data/PUBLIC_MANIFEST.json" = "data/PUBLIC_MANIFEST.json"
"data/SOURCES.md" = "data/SOURCES.md"
"docs/DATA_GOVERNANCE.md" = "docs/DATA_GOVERNANCE.md"
"docs/LIMITATIONS.md" = "docs/LIMITATIONS.md"
"docs/SOURCE_REGISTRY.md" = "docs/SOURCE_REGISTRY.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = [".superpowers/sdd/baselines/**", "notebooks/*.ipynb"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
packages = ["chile_demographic_pde"]

[[tool.mypy.overrides]]
module = ["scipy.*", "skfem.*", "statsmodels.*", "numpyro.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebook.py" = ["RUF001"]
